[package]
name = "openbatrangs"
version = "0.1.27"
edition = "2021"
description = "🦇 openBatarangs - Agentic coding CLI for local models via Ollama"
license = "AGPL-3.0"
repository = "https://github.com/arpanpathak/openbatrangs"
readme = "README.md"
keywords = ["agent", "ollama", "coding", "cli", "local-llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
futures-util = "0.3"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs"] }
unicode-segmentation = "1"
unicode-width = "0.2"
walkdir = "2"
