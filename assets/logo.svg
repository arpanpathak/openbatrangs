<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="openBatarangs logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="batarang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- faint code/terminal grid -->
  <g stroke="#22d3ee" stroke-opacity="0.06" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="160" x2="416" y2="160"/>
    <line x1="96" y1="224" x2="416" y2="224"/>
    <line x1="96" y1="96" x2="96" y2="224"/>
    <line x1="160" y1="96" x2="160" y2="224"/>
    <line x1="224" y1="96" x2="224" y2="224"/>
    <line x1="288" y1="96" x2="288" y2="224"/>
    <line x1="352" y1="96" x2="352" y2="224"/>
    <line x1="416" y1="96" x2="416" y2="224"/>
  </g>

  <!-- code brackets in background -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.10" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 96 L96 128 L128 160"/>
    <path d="M384 96 L416 128 L384 160"/>
  </g>

  <!-- Batarang weapon silhouette -->
  <g filter="url(#glow)">
    <path
      d="M256 160
         L244 130 L252 165 L56 190 L120 215 L90 235 L170 240 L256 260
         L342 240 L422 235 L392 215 L456 190 L260 165 L268 130 Z"
      fill="url(#batarang)"
      stroke="url(#accent)"
      stroke-width="4"
      stroke-linejoin="round"/>
  </g>

  <!-- terminal caret engraved in the blade center -->
  <text x="256" y="232" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="30" font-weight="700" fill="#22d3ee" opacity="0.9">&gt;_</text>

  <!-- wordmark -->
  <text x="256" y="438" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="1" fill="#f8fafc">
    <tspan fill="#22d3ee">open</tspan>Batarangs
  </text>

  <text x="256" y="474" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="17" letter-spacing="3" fill="#8b93a7">AGENTIC CODING · LOCAL MODELS</text>
</svg>
